[general]
  loglevel = "warning"
  hosts = ["jewelchat.net"]
  host_types = []
  default_server_domain = "jewelchat.net"
  registration_timeout = "infinity"
  language = "en"

[[listen.http]]
  port = 5280
  transport.num_acceptors = 10
  transport.max_connections = 1024

  [[listen.http.handlers.mongoose_bosh_handler]]
    host = "_"
    path = "/http-bind"

  [[listen.http.handlers.mongoose_websocket_handler]]
    host = "_"
    path = "/ws-xmpp"
    # Default idle timeout is 60s (cowboy closes the socket if it sees no
    # frames for that long) — too short for manual testing where you sit
    # reading the log or filling in a form. 10 minutes is more forgiving;
    # the xmpp/ test console also sends its own keepalive ping every 30s
    # as a second line of defense.
    timeout = 600_000

[[listen.http]]
  port = 5285
  transport.num_acceptors = 10
  transport.max_connections = 1024
  tls.verify_mode = "none"
  tls.certfile = "priv/ssl/fake_cert.pem"
  tls.keyfile = "priv/ssl/fake_key.pem"

  [[listen.http.handlers.mongoose_bosh_handler]]
    host = "_"
    path = "/http-bind"

  [[listen.http.handlers.mongoose_websocket_handler]]
    host = "_"
    path = "/ws-xmpp"
    # Default idle timeout is 60s (cowboy closes the socket if it sees no
    # frames for that long) — too short for manual testing where you sit
    # reading the log or filling in a form. 10 minutes is more forgiving;
    # the xmpp/ test console also sends its own keepalive ping every 30s
    # as a second line of defense.
    timeout = 600_000

[[listen.c2s]]
  port = 5222
  access = "c2s"
  shaper = "normal"
  max_stanza_size = 65536
  tls.verify_mode = "none"
  tls.certfile = "priv/ssl/fake_cert.pem"
  tls.keyfile = "priv/ssl/fake_key.pem"

[[listen.s2s]]
  port = 5269
  shaper = "fast"
  max_stanza_size = 131072
  tls.verify_mode = "none"
  tls.certfile = "priv/ssl/fake_cert.pem"
  tls.keyfile = "priv/ssl/fake_key.pem"

[[listen.component]]
  port = 8888
  access = "all"
  shaper = "fast"
  ip_address = "127.0.0.1"
  password = "secret"

[auth]
  methods = ["http"]

  [auth.http]

  # Force plain password auth: the http backend only implements plaintext
  # check_password, but MongooseIM defaults to SCRAM (format = "scram"),
  # which calls get_password instead and tries to parse the response as
  # SCRAM-serialized data — that path can never succeed against this backend.
  [auth.password]
    format = "plain"

[internal_databases.mnesia]

# Backend database for MongooseIM (accounts/MAM/etc. can be pointed at this
# pool once you enable the relevant rdbms-backed modules).
# The container reaches the host's `mysql-db` container through its published
# port via host.docker.internal, so no extra docker network wiring is needed.
[outgoing_pools.rdbms.default]
  scope = "global"
  workers = 5

  [outgoing_pools.rdbms.default.connection]
    driver = "mysql"
    host = "host.docker.internal"
    port = 3306
    database = "mongooseim"
    username = "mongooseim"
    password = "C1hgqgbRuVUjTRiEji2PUvmQ"

# HTTP auth backend: MongooseIM calls out to this service for
# check_password / user_exists / get_password / register / set_password /
# remove_user. The container reaches the host's `serverprojectx` container
# (localhost:3000) via host.docker.internal, same as the MySQL pool above.
[outgoing_pools.http.auth]
  scope = "global"
  workers = 10

  [outgoing_pools.http.auth.connection]
    host = "http://host.docker.internal:3000"
    path_prefix = "/mongooseim/"
    request_timeout = 2000

# HTTP pool mod_push_service_mongoosepush posts outgoing push notifications
# through. Points at the same nodeapp backend as the auth pool above (same
# host.docker.internal:3000 bridging), but with its own path_prefix — the
# module appends "<api_version>/notification/<device_id>" to whatever prefix
# is set here, so "/mongooseim/pushnotification/" + "v3/notification/<id>"
# gives the full "/mongooseim/pushnotification/v3/notification/:deviceid"
# endpoint. This pool name ("mongoose_push") is distinct from the generic
# (non-HTTP) wpool the module starts internally under the fixed name
# "mongoosepush_service" — don't confuse the two.
[outgoing_pools.http.mongoose_push]
  scope = "global"
  workers = 10

  [outgoing_pools.http.mongoose_push.connection]
    host = "http://host.docker.internal:3000"
    path_prefix = "/mongooseim/pushnotification/"
    request_timeout = 2000

[services.service_bosh]

[services.service_mongoose_system_metrics]

[modules.mod_adhoc]

[modules.mod_disco]
  users_can_see_hidden_services = false

[modules.mod_stream_management]

[modules.mod_register]
  ip_access = [
    {address = "127.0.0.0/8", policy = "allow"},
    {address = "0.0.0.0/0", policy = "deny"}
  ]
  access = "register"

[modules.mod_presence]

# Without any handler on the `offline_message` hook, a chat message to an
# offline user bounces: ejabberd_sm always registers a fallback handler
# (priority 100) that replies to the sender with a service-unavailable error
# wrapping the original stanza (ejabberd_sm:bounce_offline_message/3) — the
# "server echoes my own message back to me" symptom.
#
# Deliberately using mod_offline_stub here instead of mod_offline: mod_mam
# (below) already persists every message - online or offline - independent
# of delivery outcome, so a real offline-message queue would just be a second
# copy of the same data for no reason. mod_offline_stub's hooks/1 registers
# exactly one handler, on `offline_message` at priority 75 (still ahead of
# ejabberd_sm's 100), whose entire body is `{stop, Acc}` — it does no storage
# of its own, it only exists to stop the hook chain before the bounce
# fallback fires, since RFC 6121 §8.5.2.2.1 only requires that bounce when the
# message truly wasn't persisted anywhere, which isn't true here thanks to
# MAM. Recipients get messages sent while they were offline via a MAM
# catch-up query on reconnect, not pushed automatically the way mod_offline's
# pop-on-login would have — that's an accepted trade for not maintaining a
# second storage path.
[modules.mod_offline_stub]

# Roster (contact list) management — handles jabber:iq:roster IQs (add/
# remove/query contacts, subscription state). backend = "rdbms" matches the
# rosterusers / rostergroups / roster_version tables already loaded into
# MySQL, instead of the module's mnesia default. Versioning (XEP-0237) left
# off — the xmpp/ test console doesn't implement it, so there's nothing to
# exercise it right now.
[modules.mod_roster]
  backend = "rdbms"

[modules.mod_sic]

[modules.mod_time]

# XEP-0199 Ping — without this, <iq><ping xmlns='urn:xmpp:ping'/></iq> gets
# service-unavailable (no handler registered for the namespace) instead of
# a proper result. The xmpp/ test console's 30s keepalive relies on this
# for a real pong, not just raw socket traffic.
[modules.mod_ping]

[modules.mod_vcard]
  host = "vjud.@HOST@"

[modules.mod_carboncopy]

# Signing keys for mod_auth_token. "token_secret" is the fixed key name
# mod_auth_token looks up for both access and refresh tokens. "ram" keys are
# generated in memory and regenerate on every restart (fine for dev; use
# type = "file" if issued tokens need to survive a restart).
[modules.mod_keystore]
  ram_key_size = 32
  keys = [
    {name = "token_secret", type = "ram"}
  ]

# Token-based auth. backend defaults to "rdbms", which matches the
# auth_token table already present in the MySQL schema loaded earlier.
[modules.mod_auth_token]
  validity_period.access = {value = 5, unit = "minutes"}
  validity_period.refresh = {value = 5, unit = "minutes"}

# Message Archive Management. backend = "rdbms" matches the mam_message /
# mam_muc_message / mam_config / mam_server_user tables already loaded into
# MySQL. full_text_search is off because that schema has no FULLTEXT index
# on the search_body columns, so MAM text-search queries would error against
# it if left on (message storage/retrieval itself is unaffected either way).
# [modules.mod_mam.muc].host is set to mod_muc_light's own subdomain
# (muclight.@HOST@) rather than mod_mam's default, which targets the
# classic mod_muc subdomain instead — since only mod_muc_light is enabled
# here, MAM's MUC archive-query IQ handler must be registered on the
# subdomain mod_muc_light actually uses, or group-chat archive queries would
# be routed nowhere.
[modules.mod_mam]
  backend = "rdbms"
  full_text_search = false

  [modules.mod_mam.pm]

  [modules.mod_mam.muc]
    host = "muclight.@HOST@"

# Lightweight MUC (group chat). backend = "rdbms" matches the muc_light_rooms
# / muc_light_config / muc_light_occupants / muc_light_blocking tables
# already loaded into MySQL, instead of the module's mnesia default.
# allow_multiple_owners: test accounts are peers, not a fixed admin, so any
# owner can promote another occupant to co-owner instead of there being a
# single privileged creator.
# Note: promote_on_last_owner_leave (mentioned in the module docs) is NOT a
# recognized config key in this MongooseIM version (6.6.0) — the running
# node's own config_spec error confirmed the accepted key set, and this
# wasn't in it. Left out; if the last owner leaves with members still
# present, whatever this version's built-in (non-configurable) behavior is
# will apply.
[modules.mod_muc_light]
  backend = "rdbms"
  allow_multiple_owners = true

# Adapter that knows how to call out to a MongoosePush-shaped push gateway —
# here, the nodeapp backend's /mongooseim/pushnotification/ route (see the
# outgoing_pools.http.mongoose_push pool above for the actual host/path).
# pool_name must match that pool's name exactly; api_version is appended into
# the request path by the module itself ("v3/notification/<device_id>").
# This module only knows how to *send* a push once asked — mod_event_pusher's
# "push" backend below (XEP-0357) is what actually decides when to ask it.
[modules.mod_push_service_mongoosepush]
  pool_name = "mongoose_push"
  api_version = "v3"

# XEP-0357 (Push Notifications): lets a client register ("enable") a device
# for push while it's connected, so offline-message delivery can trigger an
# actual push instead of silently queuing. backend = "rdbms" matches the
# event_pusher_push_subscription table already loaded into MySQL (stores
# owner_jid/node/pubsub_jid/form per registration), instead of the module's
# mnesia default.
#
# virtual_pubsub_hosts is the key wiring piece: a real XEP-0357 client enables
# push against a PubSub *service* JID (`<enable jid='<pubsub-jid>' .../>`).
# Since there's no real PubSub server running here, that service JID must
# match one of these subdomain templates — only then does MongooseIM treat it
# as "virtual" and route straight to mod_push_service_mongoosepush's hook
# instead of trying to deliver a real pubsub#publish IQ over the wire (which
# would go nowhere and just time out). Dedicated subdomain picked to match
# this project's existing convention (vjud.@HOST@, muclight.@HOST@) rather
# than overloading the bare domain.
#
# Client-side contract for this to actually fire a push (not yet exercised
# against this server — see CLAUDE.md "mod_event_pusher / push" notes):
#   <iq type='set'>
#     <enable xmlns='urn:xmpp:push:0' jid='pubsub.jewelchat.net' node='<any-id>'>
#       <x xmlns='jabber:x:data' type='submit'>
#         <field var='FORM_TYPE'><value>http://jabber.org/protocol/pubsub#publish-options</value></field>
#         <field var='device_id'><value>DEVICE_TOKEN</value></field>
#         <field var='service'><value>fcm</value></field>
#       </x>
#     </enable>
#   </iq>
# `device_id` and `service` are read out of that publish-options form by
# mod_push_service_mongoosepush (not from `node`, which is just XEP-0357's
# opaque registration key) — both fields are required or the push silently
# no-ops (service) or crashes the request handler (missing device_id).
[modules.mod_event_pusher.push]
  backend = "rdbms"
  virtual_pubsub_hosts = ["pubsub.@HOST@"]

